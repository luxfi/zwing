[project]
name = "zwing"
version = "0.2.2"
description = "Z-Wing — Lux post-quantum secure channel (Python). IETF X-Wing KEM combiner."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Lux Industries", email = "dev@lux.network" }]
requires-python = ">=3.10"
keywords = ["post-quantum", "kem", "x-wing", "ml-kem", "zwing", "lux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/luxfi/zwing"
Repository = "https://github.com/luxfi/zwing"
Issues = "https://github.com/luxfi/zwing/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zwing.py"]
